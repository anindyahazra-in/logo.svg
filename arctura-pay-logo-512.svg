<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <!-- Emerald accent gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10d9a0"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft glow for icon -->
    <filter id="iconGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Clip for rounded square -->
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g clip-path="url(#roundedClip)" opacity="0.04">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#10d9a0" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#10d9a0" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#10d9a0" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#10d9a0" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#10d9a0" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#10d9a0" stroke-width="1"/>
  </g>

  <!-- Ambient glow blob top-right -->
  <ellipse cx="380" cy="130" rx="120" ry="90" fill="#10d9a0" opacity="0.06"/>
  <!-- Ambient glow blob bottom-left -->
  <ellipse cx="140" cy="390" rx="100" ry="80" fill="#f59e0b" opacity="0.06"/>

  <!-- === ICON MARK: Stylized "A" lane arrow === -->
  <!-- Outer hexagon ring -->
  <polygon points="256,108 316,142 316,210 256,244 196,210 196,142"
    fill="none" stroke="url(#emeraldGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Inner geometric A shape with lane/arrow concept -->
  <!-- Left leg of A -->
  <path d="M220,222 L256,138 L256,138" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#iconGlow)"/>
  <!-- Right leg of A -->
  <path d="M256,138 L292,222" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#iconGlow)"/>
  <!-- Crossbar of A (gold) -->
  <line x1="232" y1="196" x2="280" y2="196" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" filter="url(#iconGlow)"/>

  <!-- Arrow / lane line pointing right -->
  <path d="M230,240 L282,240 L272,232 M282,240 L272,248"
    stroke="url(#emeraldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Gold dot accent -->
  <circle cx="256" cy="138" r="6" fill="url(#goldGrad)" filter="url(#iconGlow)"/>

  <!-- === WORDMARK === -->
  <!-- ARCTURA -->
  <text
    x="256"
    y="318"
    text-anchor="middle"
    font-family="'Trebuchet MS', 'Arial Narrow', sans-serif"
    font-size="62"
    font-weight="800"
    letter-spacing="6"
    fill="#f0fdf4"
  >ARCTURA</text>

  <!-- PAY — in gold, smaller, tracked wide -->
  <text
    x="256"
    y="364"
    text-anchor="middle"
    font-family="'Trebuchet MS', 'Arial Narrow', sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="16"
    fill="url(#goldGrad)"
  >PAY</text>

  <!-- Thin divider line -->
  <line x1="176" y1="382" x2="336" y2="382" stroke="#10d9a0" stroke-width="1.5" opacity="0.4"/>

  <!-- Tagline -->
  <text
    x="256"
    y="404"
    text-anchor="middle"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="16"
    font-weight="400"
    letter-spacing="3"
    fill="#6b7280"
  >YOUR EARNING PATH</text>

</svg>
